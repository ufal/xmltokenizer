# TEITOK profile — TEI defaults with TEITOK id conventions.
# Extends ``tei``; only overrides id attributes to plain ``id``
# (TEITOK corpora typically use @id, not @xml:id).

extends = "tei"
name = "teitok"

# <am>ꝑ</am><ex>per</ex>cid: the tagger reads "percid"; @form keeps what is
# written ("ꝑcid"), @expan the expanded form.
hidden_inline_elements = ["am"]
expansion_elements = ["ex"]

[tok_attrs]
id_attr = "id"

[s_attrs]
id_attr = "id"
